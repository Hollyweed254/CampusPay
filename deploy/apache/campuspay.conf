# CampusPay — Apache virtual host (domain root).
# Enable modules: a2enmod ssl headers rewrite
# Copy to /etc/apache2/sites-available/campuspay.conf, then:
#   a2ensite campuspay && apache2ctl configtest && systemctl reload apache2
#
# Requires the app at /var/www/campuspay with public/ as DocumentRoot.

<VirtualHost *:80>
    ServerName pay.example.com
    Redirect permanent / https://pay.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName pay.example.com
    DocumentRoot /var/www/campuspay/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/pay.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/pay.example.com/privkey.pem
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1

    <Directory /var/www/campuspay/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Security headers for every response, including static assets that never
    # reach PHP. Mirrors send_security_headers().
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    </IfModule>

    # Belt and braces: never serve secrets or source, even if root moves.
    <FilesMatch "(^\.|\.(sql|log|md|lock|ini|env)$)">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/campuspay-error.log
    CustomLog ${APACHE_LOG_DIR}/campuspay-access.log combined
</VirtualHost>
