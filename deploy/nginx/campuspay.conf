# CampusPay — Nginx virtual host (domain root).
# Adjust server_name, paths and the PHP-FPM socket, then:
#   ln -s /etc/nginx/sites-available/campuspay /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Requires the app at /var/www/campuspay with public/ as the only web root.

server {
    listen 80;
    listen [::]:80;
    server_name pay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pay.example.com;

    root /var/www/campuspay/public;
    index index.php;

    # TLS — issue certificates with certbot and let it manage these lines.
    ssl_certificate     /etc/letsencrypt/live/pay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers for every response, including static assets that never
    # pass through PHP. Values mirror send_security_headers(); nginx headers
    # take precedence, so they are safe to set here too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Refuse to execute anything that is not a real file (upload safety).
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 30s;
    }

    # No dotfiles, no source, no secrets — even though they sit outside root.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sql|log|md|lock|ini|env)$ { deny all; }

    location = /favicon.ico { access_log off; log_not_found off; }
}
